<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regal Travel | Trip Details</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./css/styles.css">
  
  <style>
    /* Details Page Styles */
    .details-hero {
      position: relative;
      height: 60vh;
      min-height: 400px;
      display: flex;
      align-items: flex-end;
      padding-bottom: 50px;
      color: white;
      z-index: 1;
    }
    
    .hero-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }
    
    .details-hero::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to top, rgba(15, 32, 39, 0.95) 0%, rgba(15, 32, 39, 0.3) 100%);
      z-index: -1;
    }
    
    .trip-title {
      font-size: 4rem;
      color: var(--color-cream);
      margin-bottom: 10px;
    }
    
    .trip-meta {
      display: flex;
      gap: 30px;
      font-size: 1.1rem;
      font-weight: 500;
      color: rgba(255,255,255,0.6);
    }
    
    .trip-meta i {
      color: var(--color-gold);
      margin-right: 8px;
    }
    
    .content-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 50px;
      padding: 60px 0;
    }
    
    /* Left Column */
    .section-block {
      margin-bottom: 50px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    .section-title-sm {
      font-family: var(--font-serif);
      font-size: 1.8rem;
      color: var(--color-gold);
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .section-title-sm i { color: var(--color-sage); }
    
    /* Itinerary Timeline */
    .timeline {
      position: relative;
      padding-left: 30px;
    }
    
    .timeline::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: rgba(255,255,255,0.1);
    }
    
    .timeline-item {
      position: relative;
      margin-bottom: 40px;
    }
    
    .timeline-item:last-child {
      margin-bottom: 0;
    }
    
    .timeline-item::before {
      content: '';
      position: absolute;
      left: -36px;
      top: 5px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: var(--color-gold);
      border: 3px solid rgba(15,32,39,0.8);
      box-shadow: 0 0 8px rgba(249,202,36,0.3);
    }
    
    .day-badge {
      display: inline-block;
      background: linear-gradient(135deg, #f9ca24, #f0932b);
      color: var(--color-black);
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    
    .day-title {
      font-size: 1.2rem;
      color: #fff;
      margin-bottom: 15px;
      font-family: var(--font-sans);
    }
    
    .activities-list li {
      position: relative;
      padding-left: 20px;
      margin-bottom: 10px;
      color: rgba(255,255,255,0.6);
    }
    
    .activities-list li::before {
      content: '\f105';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      left: 0;
      color: var(--color-sage);
    }
    
    /* Places Grid */
    .places-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    
    .place-card {
      background: rgba(255, 255, 255, 0.04);
      padding: 20px;
      border-radius: 8px;
      border-left: 4px solid var(--color-sage);
      transition: transform 0.2s, background 0.2s;
    }
    .place-card:hover {
      transform: translateX(5px);
      background: rgba(255,255,255,0.07);
    }
    
    .place-card h4 {
      margin-bottom: 10px;
      font-family: var(--font-sans);
      color: #fff;
    }
    
    .place-card p {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.5);
    }
    
    /* Right Column (Sidebar) */
    .sidebar-widget {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 30px;
      position: sticky;
      top: 100px;
    }
    
    .price-lg {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--color-gold);
      margin-bottom: 20px;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    
    .price-text {
      font-size: 1rem;
      font-weight: 500;
      color: rgba(255,255,255,0.5);
    }
    
    /* Budget Chart Bars */
    .budget-item {
      margin-bottom: 15px;
    }
    
    .budget-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 5px;
      color: rgba(255,255,255,0.7);
    }
    
    .budget-bar-bg {
      height: 8px;
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
      overflow: hidden;
    }
    
    .budget-bar-fill {
      height: 100%;
      border-radius: 4px;
    }
    
    .fill-stay { background: linear-gradient(90deg, #2c5364, #4ca1af); }
    .fill-travel { background: linear-gradient(90deg, #f9ca24, #f0932b); }
    .fill-food { background: linear-gradient(90deg, #00cec9, #55efc4); }
    .fill-activities { background: linear-gradient(90deg, #6c5ce7, #a29bfe); }
    .fill-misc { background: linear-gradient(90deg, #636e72, #b2bec3); }
    
    /* Weather Widget */
    .weather-widget {
      text-align: center;
      padding: 20px 0;
    }
    
    .weather-icon img {
      width: 80px;
      height: 80px;
    }
    
    .weather-temp {
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
    }
    
    .weather-desc {
      color: rgba(255,255,255,0.6);
      text-transform: capitalize;
      margin-bottom: 15px;
    }
    
    .weather-details {
      display: flex;
      justify-content: center;
      gap: 20px;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.5);
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 15px;
    }
    
    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 30px;
    }
    
    /* Loading overlay */
    #pageLoader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0f2027, #203a43);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    
    /* Booking Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 32, 39, 0.85);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    
    .modal-content {
      background: rgba(32, 58, 67, 0.95);
      backdrop-filter: blur(20px);
      width: 90%;
      max-width: 500px;
      border-radius: 16px;
      padding: 30px;
      position: relative;
      transform: translateY(20px);
      transition: transform 0.3s ease;
      box-shadow: 0 25px 60px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    .modal-overlay.active .modal-content {
      transform: translateY(0);
    }
    
    .modal-close {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: rgba(255,255,255,0.5);
    }
    .modal-close:hover { color: #fff; }
    
    .modal-header {
      font-family: var(--font-serif);
      font-size: 1.8rem;
      color: var(--color-gold);
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      color: rgba(255,255,255,0.6);
    }
    
    .form-group .input-field {
      width: 100%;
      padding: 12px 15px;
    }

    .booking-summary {
      background: rgba(255,255,255,0.04);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .booking-summary p {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      color: rgba(255,255,255,0.6);
    }
    
    .booking-summary .total {
      font-weight: 700;
      color: var(--color-gold);
      font-size: 1.2rem;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 10px;
      margin-top: 5px;
    }

    @media (max-width: 900px) {
      .content-grid {
        grid-template-columns: 1fr;
      }
      .trip-title { font-size: 3rem; }
      .places-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Loading State -->
  <div id="pageLoader">
    <div class="spinner" style="border-width: 6px; width: 60px; height: 60px;"></div>
  </div>

  <nav class="navbar" id="navbar">
    <a href="./index.html" class="nav-brand">
      <i class="fa-solid fa-compass"></i> Regal Travel
    </a>
    
    <button class="mobile-menu-btn" id="mobileMenuBtn">
      <i class="fa-solid fa-bars"></i>
    </button>
    
    <div class="nav-links" id="navLinks">
      <a href="./index.html" class="nav-link">Home</a>
      <a href="./recommendations.html" class="nav-link">Destinations</a>
      
      <a href="./auth.html" class="nav-link" id="navLoginBtn">Login</a>
      <a href="./auth.html" class="btn btn-primary" id="navSignupBtn">Sign Up</a>
      
      <a href="./dashboard.html" class="nav-link auth-hidden" id="navDashboardBtn">My Dashboard</a>
      <button class="btn btn-secondary auth-hidden" id="navLogoutBtn">Logout</button>
    </div>
  </nav>

  <!-- Content injected via JS -->
  <div id="detailsContent"></div>

  <!-- Booking Modal -->
  <div class="modal-overlay" id="bookingModal">
    <div class="modal-content">
      <button class="modal-close" id="closeModalBtn">&times;</button>
      <h2 class="modal-header">Book Your Trip</h2>
      
      <form id="bookingForm">
        <!-- Step 1: Details -->
        <div id="bookingStep1">
          <div class="form-group">
            <label for="bookName">Full Name</label>
            <input type="text" id="bookName" class="input-field" required placeholder="Enter your full name">
          </div>
          
          <div class="form-group">
            <label for="bookDate">Travel Date</label>
            <input type="date" id="bookDate" class="input-field" required>
          </div>
          
          <div class="form-group">
            <label for="bookPeople">Number of People</label>
            <input type="number" id="bookPeople" class="input-field" min="1" max="20" value="1" required>
          </div>

          <div class="booking-summary">
            <p><span>Price per person:</span> <span id="summaryPrice">₹0</span></p>
            <p class="total"><span>Total Cost:</span> <span id="summaryTotal">₹0</span></p>
          </div>
          
          <button type="button" class="btn btn-primary" id="proceedPaymentBtn" style="width: 100%;">Proceed to Payment</button>
        </div>

        <!-- Step 2: Payment -->
        <div id="bookingStep2" style="display: none;">
          <h3 style="font-family: var(--font-sans); margin-bottom: 15px; font-size: 1.1rem;">Payment Information</h3>
          
          <div class="form-group">
            <label for="cardNumber">Card Number</label>
            <input type="text" id="cardNumber" class="input-field" placeholder="1234 5678 9101 1121" maxlength="19">
          </div>
          
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="form-group">
              <label for="cardExpiry">Expiry Date</label>
              <input type="text" id="cardExpiry" class="input-field" placeholder="MM/YY" maxlength="5">
            </div>
            <div class="form-group">
              <label for="cardCvv">CVV</label>
              <input type="text" id="cardCvv" class="input-field" placeholder="123" maxlength="3">
            </div>
          </div>

          <div class="booking-summary" style="margin-top: 10px;">
            <p class="total"><span>Amount to Pay:</span> <span id="paymentTotal">₹0</span></p>
          </div>
          
          <div style="display: flex; gap: 10px;">
            <button type="button" class="btn btn-secondary" id="backToDetailsBtn" style="flex: 1;">Back</button>
            <button type="submit" class="btn btn-primary" id="confirmBookingBtn" style="flex: 2;">Pay & Book</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="margin-top: 0; padding-top: 20px; border: none;">
        <p>&copy; 2024 Regal Travel. Designed with the Regal Palette.</p>
      </div>
    </div>
  </footer>

  <script src="./js/sky-animation.js?v=1774533971797"></script>
  <script src="./js/data.js?v=1774533971797"></script>
  <script src="./js/api.js?v=1774533971797"></script>
  <script src="./js/details.js?v=1774533971797"></script>
</body>
</html>
