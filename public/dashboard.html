<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regal Travel | My Dashboard</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/styles.css">
  
  <style>
    body {
      padding-top: 80px;
    }
    
    .dashboard-header {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(10px);
      padding: 40px 5%;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }
    
    .user-welcome h1 {
      margin-bottom: 5px;
      font-size: 2.5rem;
      color: #fff;
    }
    .user-welcome p {
      color: rgba(255,255,255,0.55);
    }
    
    .dashboard-stats {
      display: flex;
      gap: 30px;
    }
    
    .stat-box {
      text-align: center;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
      padding: 15px 30px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    .stat-num {
      font-size: 2rem;
      font-weight: 700;
      color: var(--color-gold);
      font-family: var(--font-serif);
      line-height: 1;
    }
    
    .stat-label {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 5px;
    }
    
    .dashboard-content {
      padding: 60px 5%;
      min-height: 50vh;
    }
    
    .section-heading {
      font-family: var(--font-sans);
      font-size: 1.5rem;
      color: #fff;
      margin-bottom: 30px;
      padding-bottom: 10px;
      border-bottom: 2px solid rgba(255,255,255,0.1);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 30px;
      margin-bottom: 60px;
    }
    
    .trip-card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      transition: transform 0.3s;
      border: 1px solid rgba(255,255,255,0.1);
      position: relative;
    }
    
    .trip-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 35px rgba(0,0,0,0.3);
      border-color: rgba(249,202,36,0.3);
    }
    
    .card-img-wrapper {
      position: relative;
      height: 180px;
    }
    
    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .dashboard-actions {
      position: absolute;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 10px;
      z-index: 2;
    }
    
    .action-btn {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: rgba(15,32,39,0.7);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      transition: all 0.2s;
      color: rgba(255,255,255,0.6);
    }
    
    .action-btn:hover {
      transform: scale(1.1);
      color: #fff;
    }
    
    .btn-fav { color: rgba(255,255,255,0.6); }
    .btn-fav.active { color: var(--color-error); }
    .btn-delete { color: rgba(255,255,255,0.6); }
    .btn-delete:hover { color: var(--color-error); }
    
    .card-content {
      padding: 20px;
    }
    
    .card-title {
      font-size: 1.2rem;
      margin-bottom: 5px;
      color: #fff;
    }
    
    .card-price {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--color-gold);
      margin-top: 15px;
    }
    
    .booking-card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }
    
    .booking-info h3 {
      font-size: 1.2rem;
      margin-bottom: 5px;
      color: #fff;
      font-family: var(--font-sans);
    }
    
    .booking-info p {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.5);
      margin-bottom: 3px;
    }
    
    .booking-price {
      text-align: right;
    }
    
    .booking-price .amount {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--color-gold);
    }
    
    .booking-status {
      display: inline-block;
      padding: 4px 10px;
      background: rgba(0, 206, 201, 0.15);
      color: var(--color-sage);
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 5px;
    }

    @media (max-width: 768px) {
      .booking-card {
        flex-direction: column;
        align-items: flex-start;
      }
      .booking-price { text-align: left; margin-top: 10px; }
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      border: 1px dashed rgba(255,255,255,0.15);
      grid-column: 1 / -1;
    }
    
    .empty-state i {
      font-size: 3rem;
      color: rgba(255,255,255,0.2);
      margin-bottom: 15px;
    }
    .empty-state h3, .empty-state h2 { color: rgba(255,255,255,0.6); }
    .empty-state p { color: rgba(255,255,255,0.4); }
    
    .recent-list {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      padding-bottom: 20px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.2) transparent;
    }
    
    .recent-list::-webkit-scrollbar { height: 8px; }
    .recent-list::-webkit-scrollbar-track { background: transparent; border-radius: 4px; }
    .recent-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    
    .recent-item {
      min-width: 250px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s, border-color 0.3s;
    }
    .recent-item:hover {
      transform: translateY(-4px);
      border-color: rgba(249,202,36,0.3);
    }
    
    .recent-img {
      height: 120px;
      width: 100%;
      object-fit: cover;
    }
    
    .recent-content {
      padding: 15px;
    }
    
    .recent-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar scrolled" id="navbar">
    <a href="/" class="nav-brand">
      <i class="fa-solid fa-compass"></i> Regal Travel
    </a>
    
    <button class="mobile-menu-btn" id="mobileMenuBtn">
      <i class="fa-solid fa-bars"></i>
    </button>
    
    <div class="nav-links" id="navLinks">
      <a href="/" class="nav-link">Home</a>
      <a href="/recommendations.html" class="nav-link">Destinations</a>
      <a href="/dashboard.html" class="nav-link active" id="navDashboardBtn">My Dashboard</a>
      <button class="btn btn-secondary" id="navLogoutBtn">Logout</button>
    </div>
  </nav>

  <!-- Dashboard Header -->
  <header class="dashboard-header fade-up">
    <div class="user-welcome">
      <h1 id="userGreeting">Welcome</h1>
      <p>Manage your curated travel experiences</p>
    </div>
    
    <div class="dashboard-stats">
      <div class="stat-box">
        <div class="stat-num" id="savedCount">0</div>
        <div class="stat-label">Saved Trips</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="bookingCount">0</div>
        <div class="stat-label">My Bookings</div>
      </div>
    </div>
  </header>

  <!-- Dashboard Content -->
  <main class="dashboard-content container">
    
    <section id="bookings">
      <h2 class="section-heading">
        My Bookings
      </h2>
      <div id="bookingsList" style="margin-bottom: 50px;">
        <div style="text-align: center; padding: 40px;"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div>
      </div>
    </section>

    <section id="saved">
      <h2 class="section-heading">
        Saved Destinations
        <a href="/recommendations.html" style="font-size: 0.9rem; font-weight: 500; color: var(--color-gold);"><i class="fa-solid fa-plus"></i> Explore More</a>
      </h2>
      
      <div id="savedGrid" class="grid fade-up delay-1">
        <div style="grid-column: 1/-1; text-align: center; padding: 40px;"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div>
        <!-- Injected via JS -->
      </div>
    </section>
    
    <section id="recent" style="margin-top: 50px;">
      <h2 class="section-heading">Recently Viewed</h2>
      <div id="recentList" class="recent-list fade-up delay-2">
        <!-- Injected via JS from localStorage -->
      </div>
    </section>
    
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="margin-top: 0; border: none; padding-top: 0;">
        <p>&copy; 2024 Regal Travel.</p>
      </div>
    </div>
  </footer>

  <script src="/js/sky-animation.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
